# Build and test on every push to main and every pull request. Adapted from LabOps' ci.yml.
#
# The difference from LabOps: it runs on an x64 and an ARM64 Windows runner, because DailyDocket
# ships win-x64 and win-arm64 and nothing may depend on x64 emulation. Each also publishes the hook
# exe with Native AOT for its own runtime, since that is the step most likely to break on one CPU only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DailyDocket.slnx -c Release

      - name: Test
        run: dotnet test --project src/DailyDocket.Tests/DailyDocket.Tests.csproj -c Release --no-build

      # Native AOT needs the C++ build tools, which the hosted Windows images include.
      - name: Publish the hook (Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/DailyDocket.Hook/DailyDocket.Hook.csproj -c Release -r ${{ matrix.rid }} -o "$env:RUNNER_TEMP/hook"
          if ($LASTEXITCODE -ne 0) { throw "The hook did not publish" }
          # A guard with unreadable input must block (exit 2), never let the call through.
          'not json' | & "$env:RUNNER_TEMP/hook/DailyDocket.Hook.exe" guard --claims missing.json
          if ($LASTEXITCODE -ne 2) { throw "The published guard exited $LASTEXITCODE on bad input; expected 2" }
          $global:LASTEXITCODE = 0
