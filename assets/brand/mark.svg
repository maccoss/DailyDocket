<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- The DailyDocket mark: a docket (folder) with the four things it holds coming out of it:
       the to-do list, mail and Slack behind, the calendar on its cover. -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="1" stop-color="#5B5BE8"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5FD0"/>
      <stop offset="1" stop-color="#3A3AB8"/>
    </linearGradient>
    <linearGradient id="todo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D9B4"/>
      <stop offset="1" stop-color="#14A9A0"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA03A"/>
      <stop offset="1" stop-color="#F0632B"/>
    </linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A475F7"/>
      <stop offset="1" stop-color="#7C4DE8"/>
    </linearGradient>
  </defs>

  <g transform="translate(-8,-12)">
  <!-- The folder's back. -->
  <rect x="44" y="30" width="96" height="146" rx="12" fill="url(#back)"/>

  <!-- To do: a card with two ticked lines. -->
  <rect x="100" y="30" width="80" height="54" rx="10" fill="url(#todo)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M125 47 l5 5 l9 -10"/>
    <path d="M125 67 l5 5 l9 -10"/>
    <path d="M148 47 h20"/>
    <path d="M148 67 h20"/>
  </g>

  <!-- Mail: an envelope. -->
  <rect x="102" y="90" width="84" height="52" rx="9" fill="url(#mail)"/>
  <path d="M118 97 L150 121 L180 97" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slack: a chat bubble. -->
  <path d="M114 148 h52 a12 12 0 0 1 12 12 v12 a12 12 0 0 1 -12 12 h-24 l-14 11 v-11 h-14 a12 12 0 0 1 -12 -12 v-12 a12 12 0 0 1 12 -12 z" fill="url(#chat)"/>
  <g fill="#FFFFFF">
    <circle cx="134" cy="166" r="4.5"/>
    <circle cx="147" cy="166" r="4.5"/>
    <circle cx="160" cy="166" r="4.5"/>
  </g>

  <!-- The folder's front cover, in front of the cards, with the calendar on it. -->
  <path d="M30 46 Q30 36 40 35 L106 28 Q116 27 116 37 L116 176 Q116 186 106 185 L40 178 Q30 177 30 167 Z" fill="url(#cover)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect x="46" y="88" width="54" height="50" rx="7"/>
    <path d="M46 102 h54"/>
    <path d="M60 82 v12"/>
    <path d="M86 82 v12"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="55" y="110" width="8" height="7" rx="1.5"/>
    <rect x="69" y="110" width="8" height="7" rx="1.5"/>
    <rect x="83" y="110" width="8" height="7" rx="1.5"/>
    <rect x="55" y="122" width="8" height="7" rx="1.5"/>
    <rect x="69" y="122" width="8" height="7" rx="1.5"/>
  </g>
  </g>
</svg>
