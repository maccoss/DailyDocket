# config/docket.yaml in the private data repository (maccoss/DailyDocket-Data).
# Until that repository is cloned, the app reads %LOCALAPPDATA%\DailyDocket\docket.yaml.
# Everything personal belongs here, never in the app's public code.

owner:
  name: Owner Person
  emails: [owner@example.org]        # mail from these addresses was written by the owner
  slackUserId: U0000000001            # an emoji reaction or message from this id counts as an answer
  about: a professor who runs a research lab   # one line of context for the triage model

calendars:
  - key: work                          # id omitted: the account's primary calendar
    primary: true
  - key: home
    id: abc123@group.calendar.google.com
    tag: Home
    primary: true
  - key: dept
    id: department-events@example.org
    tag: Department
    primary: false                     # shown quietly, never flagged as a clash

mail:
  windowDays: 30
  systemSenders:                       # added to the generic machine senders
    - alerts@example.com
    - "@newsletter.example.com"

slack:
  windowDays: 21

schedule:
  days: 7
  timeZone: America/Los_Angeles

# The shared nightly jobs (deep sweep of older mail, meeting prep) run on one machine.
# It renews state/lease.yaml in the data repository after each run; when the lease is more
# than graceHours past due, the first fallback takes over (the second waits twice as long)
# until the named machine returns. Machine names are compared without case.
nightly:
  machine: desktop-1
  fallback: [laptop-1]
  at: "02:00"                          # local time of the nightly run
  catchUpAt: "12:30"                   # midday meeting prep for events added or changed since
  graceHours: 2

# Meeting prep: a brief for each meeting in the next working days. Declined, cancelled and
# all-day events and meetings with no one else invited are always skipped, and a secondary
# calendar's events (primary: false) unless accepted.
prep:
  workingDays: 2
  skipCalendars: [home]
  maxPerRun: 20
